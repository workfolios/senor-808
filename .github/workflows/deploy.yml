name: Validate Footer And Navigation Refinements

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: footer-header-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Footer And Navigation Refinements
        run: node scripts/apply-footer-header-polish.mjs

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run lint

      - name: SEO Metadata Check
        run: npm run validate:seo

      - name: Build Site
        run: npm run build

      - name: Commit Generated Source To Pull Request
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/responsive-polish.css index.html scripts/validate-seo.mjs
          if git diff --cached --quiet; then
            echo "Generated source is already current."
          else
            git commit -m "Refine footer navigation and social identity"
            git push origin HEAD:"$TARGET_BRANCH"
          fi
