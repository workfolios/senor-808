name: Remediate Audited Dependency Lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dependency-lock-fix.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  remediate-lockfile:
    if: github.actor == 'workfolios' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Current Lockfile
        run: npm ci

      - name: Apply Audit-Safe Lockfile Fixes
        run: npm audit fix --package-lock-only

      - name: Commit Lockfile If Changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Remediate audited transitive dependencies"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
