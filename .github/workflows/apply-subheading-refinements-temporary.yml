name: Apply Approved Subheading Refinements

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine-feature-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v4
        with:
          ref: subheading-copy-and-purpose-audit
          fetch-depth: 0

      - name: Apply approved copy and style refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()

          replacements = {
              'Building high-contrast work through spray paint, acrylic layering, and mixed-media mark-making.': 'Building high-contrast work through spray paint, acrylic layering, &amp; mixed-media mark-making',
              'High-contrast pieces built around motion, rhythm, and depth.': 'High-contrast pieces built around motion, rhythm, &amp; depth',
              'Grit, geometry, and signal.': 'Grit, geometry, &amp; signal',
              'Studio, stage, and emerging audio formats.': 'Studio, stage, &amp; emerging audio formats',
              'An artist-first brand with room to grow.': 'An artist-first brand with room to grow',
              'Clear expectations before a project begins.': 'Clear expectations before a project begins',
              'A clear path from first idea to focused collaboration.': 'A clear path from first idea to focused collaboration',
              'className="section-intro inquiry-intro"': 'className="section-intro inquiry-intro inquiry-intro-single"',
          }

          for old, new in replacements.items():
              if old not in app:
                  raise SystemExit(f'Missing expected source text: {old}')
              app = app.replace(old, new, 1)

          instruction = '              <p className="lead">Choose the type of inquiry, share the essential details, and review everything before sending it directly to the Señor 808 studio inbox.</p>\n'
          if instruction not in app:
              raise SystemExit('Missing expected Start A Project instruction copy')
          app = app.replace(instruction, '', 1)
          app_path.write_text(app)

          css_path = Path('src/subheading-refinement.css')
          css_path.write_text('''/* Approved subheading hierarchy and Start A Project intro refinement. */
.section-tagline,
.hero-copy .lead {
  font-weight: 400;
}

.inquiry-intro-single {
  grid-template-columns: minmax(0, 1fr);
  max-width: 900px;
}
''')

          main_path = Path('src/main.tsx')
          main = main_path.read_text()
          import_line = "import './subheading-refinement.css';"
          if import_line not in main:
              marker = "import './footer-responsive-final.css';"
              if marker not in main:
                  raise SystemExit('Missing expected final responsive import')
              main = main.replace(marker, marker + '\n' + import_line, 1)
              main_path.write_text(main)
          PY

      - name: Commit refinements to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/main.tsx src/subheading-refinement.css
          git commit -m "Refine section subheadings and inquiry intro"
          git push origin HEAD:subheading-copy-and-purpose-audit
