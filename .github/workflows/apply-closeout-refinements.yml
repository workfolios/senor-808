name: Apply Closeout SEO And Hero Refinements

on:
  push:
    branches:
      - closeout-seo-hero
    paths:
      - .github/workflows/apply-closeout-refinements.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Refinement Branch
        uses: actions/checkout@v4
        with:
          ref: closeout-seo-hero

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Source Refinements
        run: node scripts/apply-closeout-refinements.mjs

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run lint

      - name: SEO Metadata Check
        run: npm run validate:seo

      - name: Build Site
        run: npm run build

      - name: Remove One-Time Automation
        run: |
          rm scripts/apply-closeout-refinements.mjs
          rm .github/workflows/apply-closeout-refinements.yml

      - name: Commit Refined Source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize SEO metadata and refine hero copy"
          git push origin HEAD:closeout-seo-hero
