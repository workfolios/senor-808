name: Apply Final Footer Polish

on:
  push:
    branches:
      - footer-final-polish

permissions:
  contents: write

concurrency:
  group: footer-final-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply footer refinement
        run: node scripts/apply-footer-final-polish.mjs

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: SEO metadata check
        run: npm run validate:seo

      - name: Build site
        run: npm run build

      - name: Commit refined source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/responsive-polish.css
          git commit -m "Refine footer social identity and remove public rebuild note"
          git push
